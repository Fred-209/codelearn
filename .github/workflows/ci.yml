name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Integration tests in VS Code
        run: xvfb-run -a npm run test:e2e
      - name: Package .vsix
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: codelearn-vsix
          path: '*.vsix'
